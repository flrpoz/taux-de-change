name: Actualiser les taux et publier
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 14 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester les calculs et la conservation après panne
        run: |
          node scripts/test.mjs
          node scripts/test-integration.mjs
          node scripts/test-persistence.cjs
          node scripts/test-updater.mjs
      - name: Restaurer les taux persistants
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/github-data.cjs').restore({github,context,core})
      - name: Déterminer si un navigateur autorisé est nécessaire
        id: sources
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {isAuthorized} from './scripts/rates-core.mjs';const c=JSON.parse(fs.readFileSync('config/sources.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'browser='+Object.values(c.providers).some(p=>isAuthorized(p))+'\n');"
      - uses: actions/setup-python@v5
        if: steps.sources.outputs.browser == 'true'
        with:
          python-version: '3.12'
      - name: Installer Chromium si une collecte est autorisée
        if: steps.sources.outputs.browser == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python scripts/configure-browser-ci.py
      - name: Collecter uniquement les sources autorisées
        run: node scripts/collect-rates.mjs
      - name: Valider et actualiser les données
        run: node scripts/update-rates.mjs
      - name: Vérifier le paquet
        run: node scripts/check-package.mjs
      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-taux-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
      - name: Préparer les données à conserver et publier
        uses: actions/upload-artifact@v4
        with:
          name: rates-validated
          path: dist/rates.json
          retention-days: 7
  persist:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rates-validated
          path: dist
      - name: Conserver les données sur une branche séparée et signaler les échecs répétés
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/github-data.cjs').persist({github,context,core})
  deploy:
    needs: [prepare, persist]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rates-validated
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
